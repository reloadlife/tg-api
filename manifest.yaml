---
apiVersion: v1
kind: Namespace
metadata:
  name: tg-api
---
apiVersion: v1
kind: Secret
metadata:
  name: tg-api-secret
  namespace: tg-api
type: Opaque
stringData:
  apiId: "YOUR_TELEGRAM_API_ID"
  apiHash: "YOUR_TELEGRAM_API_HASH"
  # proxy: "socks5://user:pass@host:port"  # optional
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tg-api-data
  namespace: tg-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tg-front-nginx
  namespace: tg-api
data:
  default.conf: |
    server {
      listen 80;

      # serve downloaded files from PVC
      location /files/ {
        alias /data/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
      }

      # proxy everything else to Telegram Bot API
      location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://127.0.0.1:8081;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-api
  namespace: tg-api
  labels:
    app: tg-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-api
  template:
    metadata:
      labels:
        app: tg-api
    spec:
      containers:
        # Telegram Bot API (local mode, writes into PVC)
        - name: tg-api
          image: ghcr.io/reloadlife/tg-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8081
              protocol: TCP
            - name: stats
              containerPort: 8082
              protocol: TCP
          env:
            - name: TELEGRAM_API_ID
              valueFrom:
                secretKeyRef:
                  name: tg-api-secret
                  key: apiId
            - name: TELEGRAM_API_HASH
              valueFrom:
                secretKeyRef:
                  name: tg-api-secret
                  key: apiHash
            - name: TELEGRAM_PROXY
              valueFrom:
                secretKeyRef:
                  name: tg-api-secret
                  key: proxy
                  optional: true
            - name: TELEGRAM_STAT
              value: "1"
            - name: TELEGRAM_VERBOSITY
              value: "1"
            - name: TELEGRAM_MAX_CONNECTIONS
              value: "100000"
            - name: TELEGRAM_MAX_WEBHOOK_CONNECTIONS
              value: "40"
            - name: TELEGRAM_LOG_FILE
              value: ""
            - name: TELEGRAM_FILTER
              value: ""
            - name: TELEGRAM_LOCAL
              value: "1"
            - name: TELEGRAM_WORK_DIR
              value: "/var/lib/telegram-bot-api"
            - name: TELEGRAM_TEMP_DIR
              value: "/var/lib/telegram-bot-api/tmp"
          volumeMounts:
            - name: telegram-data
              mountPath: /var/lib/telegram-bot-api
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi

        # Front proxy + file server (single port 80)
        - name: tg-front
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: telegram-data
              mountPath: /data
              readOnly: true
            - name: front-nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi

      volumes:
        - name: telegram-data
          persistentVolumeClaim:
            claimName: tg-api-data
        - name: front-nginx-conf
          configMap:
            name: tg-front-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: tg-api
  namespace: tg-api
  labels:
    app: tg-api
spec:
  type: ClusterIP
  selector:
    app: tg-api
  ports:
    # One port 80 for BOTH features via path routing
    - name: http
      port: 80
      targetPort: http
    # optional stats port (direct to tg-api container)
    - name: stats
      port: 8082
      targetPort: stats
