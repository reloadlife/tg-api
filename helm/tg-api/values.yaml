# Default values for tg-api
# This is a YAML-formatted file.

replicaCount: 3

image:
  repository: ghcr.io/reloadlife/tg-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80  # Port 80 allows accessing service without specifying port
  statsPort: 8082

ingress:
  enabled: true
  className: "nginx" # or "traefik", "istio", etc.
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: tg-api.example.com
      paths:
        - path: /
          pathType: Prefix
        - path: /file
          pathType: Prefix
  tls:
    - secretName: tg-api-tls
      hosts:
        - tg-api.example.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Persistent Volume Claim for telegram-bot-api data
persistence:
  enabled: true
  storageClass: "" # Use default storage class if empty
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# Environment variables
env:
  TELEGRAM_API_ID: "" # Set via secret
  TELEGRAM_API_HASH: "" # Set via secret
  TELEGRAM_LOG_FILE: ""
  TELEGRAM_STAT: ""
  TELEGRAM_FILTER: ""
  TELEGRAM_MAX_WEBHOOK_CONNECTIONS: ""
  TELEGRAM_VERBOSITY: ""
  TELEGRAM_MAX_CONNECTIONS: ""
  TELEGRAM_PROXY: ""
  TELEGRAM_LOCAL: ""
  TELEGRAM_HTTP_IP_ADDRESS: ""

# Secret configuration
secret:
  create: true
  name: tg-api-secret
  # Values should be set via --set-file or external secret management
  # apiId: ""
  # apiHash: ""

# Additional volumes (optional)
extraVolumes: []
extraVolumeMounts: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
